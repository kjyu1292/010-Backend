[project]
name = "010_Backend"
version = "0.1.0"
description = "A backend server with FastAPI for REST, Postgres for transactional requests, and Redis for caching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt==4.1.2",
    "beanie>=2.2.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
010-Backend = "010-Backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "faker>=40.37.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres,redis]>=4.15.0",
]

