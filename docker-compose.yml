services:
  app:
    build: { context: ., dockerfile: Dockerfile }
    ports: ["8000:8000"]
    env_file: .env.docker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      name: [backend_net]

  postgres:
    image: postgres:16-alpine
    env_file: .env.docker
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d game_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      name: [backend_net]

  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      name: [backend_net]

volumes:
  postgres_data:
  redis_data:

networks:
  backend_net:
    name: 010_backend_net

